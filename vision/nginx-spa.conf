server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Включаем сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;

    # 1. Запрещаем кэшировать index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # 2. Роутинг для SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Агрессивное кэширование статики (JS/CSS с хешами, картинки, шрифты)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}