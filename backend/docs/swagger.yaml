        type: string
    type: object
  school_dto.SchoolResponseDTO:
    properties:
      district_id:
        type: string
      full_name:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  school_dto.UpdateSchoolRequestDTO:
    properties:
      district_id:
        type: string
      full_name:
        type: string
      name:
        type: string
    type: object
  user_dto.SearchAttributesUserDTO:
    properties:
      activated:
        type: boolean
      birthdate:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: integer
      id:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      role:
        type: integer
      surname:
        type: string
    type: object
  user_dto.UpdateUserRequestDTO:
    properties:
      birthdate:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: string
      password:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      surname:
        type: string
    type: object
  user_dto.UserParticipantResponseDTO:
    properties:
      activated:
        type: boolean
      birthdate:
        type: string
      citizenship:
        type: integer
      class_number:
        type: integer
      disability:
        type: integer
      email:
        type: string
      firstname:
        type: string
      gender:
        type: integer
      id:
        type: string
      participant_id:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      role:
        type: integer
      school_id:
        type: string
      surname:
        type: string
      user_id:
        type: string
    type: object
  user_dto.UserResponseDTO:
    properties:
      activated:
        type: boolean
      birthdate:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: integer
      id:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      role:
