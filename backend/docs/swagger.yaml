info:
  contact: {}
  description: Документация к backend части сайта
  title: Backend
  version: "1.0"
paths:
  /api/applications/{application_id}/review:
    patch:
      consumes:
      - application/json
      description: Модерация заявки (одобрение = 2 или отклонение = 3)
      parameters:
      - description: ID заявки
        in: path
        name: application_id
        required: true
        type: string
      - description: Решение по заявке
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event_dto.ReviewApplicationRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Review application (approve/reject)
      tags:
      - events
  /api/applications/{id}/review:
    patch:
      consumes:
      - application/json
      description: Одобрение (2) или отклонение (3) заявки модератором
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Новый статус (2 - одобрено, 3 - отклонено)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ApplicationDto.UpdateApplicationDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Review application (approve or reject)
      tags:
      - applications
  /api/applications/full-details:
    get:
      description: Получение полного списка заявок с данными о пользователях, их школах
        и событиях
      parameters:
      - description: Номер страницы
        in: query
        name: page
        type: integer
      - description: Элементов на странице
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get all full applications
      tags:
      - applications
  /api/byadmin/register:
    post:
      consumes:
      - application/json
      description: Регистрация пользователя администратором
      parameters:
      - description: Данные для регистрации от панели администратора
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/register_dto.RegisterUserRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: AdminRegister
      tags:
      - auth
  /api/events:
    get:
      description: Получение всех открытых для участия событий с пагинацией
      parameters:
      - description: Номер страницы
        in: query
        name: page
        type: integer
      - description: Количество на странице
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/event_dto.EventResponseDTO'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get open events
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Создание нового события/олимпиады (только для администраторов/организаторов)
      parameters:
      - description: Данные события
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event_dto.CreateEventRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Create event
      tags:
      - events
  /api/events/{id}/apply:
    post:
      consumes:
      - application/json
      description: Подача заявки пользователем на участие в открытом событии
      parameters:
      - description: ID события
        in: path
        name: id
        required: true
        type: string
      - description: ID пользователя (UUID)
        in: header
        name: X-User-ID
        type: string
      - description: Данные заявки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event_dto.ApplyEventRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Apply to event
      tags:
      - events
  /api/events/{id}/status:
    patch:
      consumes:
      - application/json
      description: Изменение статуса события (открыть/закрыть регистрацию)
      parameters:
      - description: ID события
        in: path
        name: id
        required: true
        type: string
      - description: Новый статус (1 = Closed, 2 = Open)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event_dto.UpdateEventStatusRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Update event status
      tags:
      - events
  /api/homeworks:
    get:
      description: Получение списка всех опубликованных и активных домашних работ
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/homework_dto.HomeworkResponseDTO'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get available homeworks
      tags:
      - homeworks
    post:
      consumes:
      - application/json
      description: Создание новой домашней работы с указанием сроков публикации и
        дедлайна
      parameters:
      - description: Данные для создания домашней работы
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/homework_dto.CreateHomeworkRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Create homework
      tags:
      - homeworks
  /api/homeworks/{homework_id}/leaderboard:
    get:
      description: Получение рейтинга учеников по конкретной домашней работе
      parameters:
      - description: ID домашней работы (UUID)
        in: path
        name: homework_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/homework_dto.StudentHomeworkLeaderboardDTO'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get homework leaderboard
      tags:
      - homeworks
  /api/homeworks/{homework_id}/submit:
    post:
      consumes:
      - application/json
      description: Сдача домашней работы пользователем с автоматической проверкой
        ответов (повторная сдача запрещена)
      parameters:
      - description: ID домашней работы (UUID)
        in: path
        name: homework_id
        required: true
        type: string
      - description: ID пользователя (UUID), если передается через заголовок
        in: header
        name: X-User-ID
        type: string
      - description: Ответы пользователя на задачи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/homework_dto.SubmitHomeworkRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/homework_dto.SubmissionResponseDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Submit homework
      tags:
      - homeworks
  /api/homeworks/{homework_id}/tasks:
    post:
      consumes:
      - application/json
      description: Прикрепление существующей задачи к домашней работе
      parameters:
      - description: ID домашней работы (UUID)
        in: path
        name: homework_id
        required: true
        type: string
      - description: ID задачи для прикрепления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/homework_dto.AddTaskToHomeworkDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Add task to homework
      tags:
      - homeworks
  /api/participants:
    get:
      description: Получение всех участников с пагинацией
      parameters:
      - description: Номер страницы
        in: query
        name: page
        type: integer
      - description: Ограничение на количество записей
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/participant_dto.ParticipantResponseDTO'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get all participants
      tags:
      - participants
  /api/participants/{id}:
    get:
      description: Получение данных об участнике по ID
      parameters:
      - description: ID участника
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/participant_dto.ParticipantResponseDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get participant by id
      tags:
      - participants
    put:
      consumes:
      - application/json
      description: Обновление данных об участнике
      parameters:
      - description: ID участника
        in: path
        name: id
        required: true
        type: string
      - description: Новые данные для обновления
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/participant_dto.UpdateParticipantRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Update participant
      tags:
