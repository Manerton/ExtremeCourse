basePath: /
definitions:
  ApplicationDto.UpdateApplicationDTO:
    properties:
      class_participation:
        type: integer
      code:
        description: "09_11_25"
        type: string
      profile:
        type: string
      reason:
        description: 1 по результатам предудущего года, 2 по результатам текущего
        type: integer
      status:
        description: // 2 = одобрено, 3 = отклонено, 1 = не обработано
        type: integer
    type: object
  event_dto.ApplyEventRequestDTO:
    properties:
      class_participation:
        type: integer
      school_id:
        type: string
    type: object
  event_dto.CreateEventRequestDTO:
    properties:
      class:
        type: integer
      name:
        type: string
      subject:
        type: string
    type: object
  event_dto.EventResponseDTO:
    properties:
      class:
        type: integer
      id:
        type: string
      name:
        type: string
      status:
        type: integer
      subject:
        type: string
    type: object
  event_dto.ReviewApplicationRequestDTO:
    properties:
      status:
        description: 2 = ApprovedStatus, 3 = RejectedStatus
        type: integer
    type: object
  event_dto.UpdateEventStatusRequestDTO:
    properties:
      status:
        description: 1 = Closed, 2 = Open
        type: integer
    type: object
  homework_dto.AddTaskToHomeworkDTO:
    properties:
      task_id:
        type: string
    type: object
  homework_dto.CreateHomeworkRequestDTO:
    properties:
      deadline_at:
        type: string
      name:
        type: string
      publish_at:
        type: string
    type: object
  homework_dto.CreateTaskRequestDTO:
    properties:
      answers:
        items:
          $ref: '#/definitions/homework_dto.TaskAnswerItemDTO'
        type: array
      description:
        type: string
      max_points:
        type: integer
      name:
        type: string
    type: object
  homework_dto.HomeworkResponseDTO:
    properties:
      deadline_at:
        type: string
      id:
        type: string
      name:
        type: string
      publish_at:
        type: string
      status:
        type: integer
    type: object
  homework_dto.StudentHomeworkLeaderboardDTO:
    properties:
      total_score:
        type: integer
      user_fio:
        type: string
      user_id:
        type: string
    type: object
  homework_dto.SubmissionResponseDTO:
    properties:
      homework_id:
        type: string
      id:
        type: string
      results:
        items:
          $ref: '#/definitions/homework_dto.TaskResultResponseDTO'
        type: array
      submitted_at:
        type: string
      total_score:
        type: integer
      user_id:
        type: string
    type: object
  homework_dto.SubmitAnswerItemDTO:
    properties:
      answer:
        type: string
      task_id:
        type: string
    type: object
  homework_dto.SubmitHomeworkRequestDTO:
    properties:
      answers:
        items:
          $ref: '#/definitions/homework_dto.SubmitAnswerItemDTO'
        type: array
    type: object
  homework_dto.TaskAnswerItemDTO:
    properties:
      answer:
        type: string
      correct:
        type: boolean
    type: object
  homework_dto.TaskResultResponseDTO:
    properties:
      is_correct:
        type: boolean
      points_awarded:
        type: integer
      task_id:
        type: string
      user_answer:
        type: string
    type: object
  login_dto.LoginRequestDTO:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  login_dto.LoginResponseDTO:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
    type: object
  participant_dto.ParticipantResponseDTO:
    properties:
      citizenship:
        type: integer
      class_number:
        type: integer
      disability:
        type: integer
      participant_id:
        type: string
      school_id:
        type: string
      user_id:
        type: string
    type: object
  participant_dto.UpdateParticipantRequestDTO:
    properties:
      citizenship:
        type: string
      class_number:
        type: integer
      disability:
        type: string
      school_id:
        type: string
    type: object
  recover_dto.ChangePasswordDTORequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  recover_dto.ForgotPasswordDTORequest:
    properties:
      code:
        type: string
      mail:
        type: string
      password:
        type: string
    type: object
  register_dto.CheckCredentialDTO:
    properties:
      credential:
        type: string
    type: object
  register_dto.RegisterParticipantRequestDTO:
    properties:
      birthdate:
        type: string
      citizenship:
        type: string
      class_number:
        type: string
      disability:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: string
      password:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      school_id:
        type: string
      surname:
        type: string
    type: object
  register_dto.RegisterUserRequestDTO:
    properties:
      birthdate:
        type: string
      email:
        type: string
      firstname:
        type: string
      gender:
        type: string
      password:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      role:
        type: string
      surname:
        type: string
    type: object
  register_dto.SendPhoneCodeDTO:
    properties:
      phone:
        type: string
    type: object
  register_dto.VerifyCodeDTO:
    properties:
      code:
        type: string
      phone_number:
        type: string
    type: object
  request.IdsRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  response.ApiResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      metadata: {}
      status:
        type: string
