# version: '3.9'

services:

  # vision:
  #   build:
  #     context: ./vision
  #     dockerfile: Dockerfile.prod
  #   container_name: vision_prod
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"          # Nginx на хосте будет ходить сюда
  #   networks:
  #     - olympic

  vision:
      build:
        context: ./vision
        dockerfile: Dockerfile.dev
      container_name: vision_app
      working_dir: /app
      volumes:
        - ./vision:/app
        - ./vision/.env:/app/.env
        - /app/node_modules  # Для NPM-совместимости
      ports:
        - "5173:5173"
      networks:
        - olympic
      environment:
        - CHOKIDAR_USEPOLLING=true
        - WATCHPACK_POLLING=true
        - HOST=0.0.0.0
        - VITE_API_URL=http://localhost:6611

  application-db:
    image: postgres:16
    container_name: application-db
    environment:
      POSTGRES_USER: application_user
      POSTGRES_PASSWORD: application_pass
      POSTGRES_DB: ApplicationServiceDB
    ports:
      - "5430:5432"
    networks:
      - olympic
    volumes:
      - application-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application_user -d ApplicationServiceDB"]
      interval: 5s
      timeout: 3s
      retries: 5


  application-service:
    build:
      context: ./ApplicationService
    container_name: application-service
    depends_on:
      application-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DSN: "postgres://application_user:application_pass@application-db:5432/ApplicationServiceDB?sslmode=disable"
      MIGRATION_PATH: "/app/migrations"
      CONFIG_PATH: "/app/config-yaml/docker.yaml"
    networks:
      - olympic
    ports:
      - "8072:8082"
    entrypoint: ["/bin/sh", "-c", "./migrator -dsn \"$DSN\" -migration-path \"$MIGRATION_PATH\" up && ./application-service"]

  apigateway-service:
    build:
      context: ./ApiGateway
    container_name: apigateway-service
    environment:
      CONFIG_PATH: "/app/config-yaml/docker.yaml"
    networks:
      - olympic
    ports:
      - "6611:6611"
    entrypoint: ["/bin/sh", "-c", "./api-gateway -config \"$CONFIG_PATH\""]


   # /bin/sh", "-c", "./migrator -dsn \"$DSN\" -migration-path \"$MIGRATION_PATH\" up &&

  event-db:
    image: postgres:16
    container_name: event-db
    environment:
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
      POSTGRES_DB: EventServiceDB
    ports:
      - "5433:5432"
    networks:
      - olympic
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U event_user -d EventServiceDB" ]
      interval: 5s
      timeout: 3s
      retries: 5

  event-service:
    build:
      context: ./event-service
    container_name: event-service
    depends_on:
      event-db:
        condition: service_healthy
    environment:
      DSN: "postgres://event_user:event_pass@event-db:5432/EventServiceDB?sslmode=disable"
      MIGRATION_PATH: "/app/migrations"
      CONFIG_PATH: "/app/config-yaml/docker.yaml"
    networks:
      - olympic
    ports:
      - "8888:8080"
    entrypoint: [ "/bin/sh", "-c", "./migrator -dsn \"$DSN\" -migration-path \"$MIGRATION_PATH\" up && ./event-service" ]

  sso-db:
    image: postgres:16
    container_name: sso-db
    environment:
      POSTGRES_USER: sso_user
      POSTGRES_PASSWORD: sso_pass
      POSTGRES_DB: SSOServiceDB
    ports:
      - "5444:5432"
    networks:
      - olympic
    volumes:
      - sso-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sso_user -d SSOServiceDB" ]
      interval: 5s
      timeout: 3s
      retries: 5

  sso-service:
    build:
      context: ./sso-service
    container_name: sso-service
    depends_on:
      sso-db:
        condition: service_healthy
    environment:
      DSN: "postgres://sso_user:sso_pass@sso-db:5432/SSOServiceDB?sslmode=disable"
      MIGRATION_PATH: "/app/migrations"
      CONFIG_PATH: "/app/config-yaml/docker.yaml"
    networks:
      - olympic
    ports:
      - "8989:8181"
    entrypoint: [ "/bin/sh", "-c", "./migrator -dsn \"$DSN\" -migration-path \"$MIGRATION_PATH\" up && ./sso-service" ]

  jury-db:
    image: postgres:16
    container_name: jury-db
    environment:
      POSTGRES_USER: jury_user
      POSTGRES_PASSWORD: jury_pass
      POSTGRES_DB: JureAssignmentsServiceDB
    ports:
      - "5445:5432"
    networks:
      - olympic
    volumes:
      - jury-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jury_user -d JureAssignmentsServiceDB" ]
      interval: 5s
      timeout: 3s
      retries: 5

  jury-service:
    build:
      context: ./Jure-assignments-service
    container_name: jury-service
    depends_on:
      jury-db:
        condition: service_healthy
    environment:
      DSN: "postgres://jury_user:jury_pass@jury-db:5432/JureAssignmentsServiceDB?sslmode=disable"
      MIGRATION_PATH: "/app/migrations"
      CONFIG_PATH: "/app/config-yaml/docker.yaml"
    networks:
      - olympic
    ports:
      - "8383:8090"
    entrypoint: [ "/bin/sh", "-c", "./migrator -dsn \"$DSN\" -migration-path \"$MIGRATION_PATH\" up && ./jury-ass-service" ]

  olymp-admin:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: olymp-admin
    ports:
      - "8083:8083"
    command:
      - /bin/sh
      - -c
      - |
        cd /var/www/olymp-admin
        if [ ! -f .env ]; then
            cp .env.example .env
        fi
        php artisan key:generate
        composer install --no-interaction --optimize-autoloader
        while ! nc -z olymp-admin-db 3306; do
          sleep 1
        done
        php artisan migrate:fresh --seed --force
        php artisan serve --host=0.0.0.0 --port=8083 &
        php-fpm -F -R &
        exec php artisan rabbitmq-handler
    volumes:
      - ./olymp-admin:/var/www/olymp-admin
    environment:
      - DB_HOST=olymp-admin-db
    depends_on:
      - olymp-admin-db
      - rabbitmq
    networks:
      - olympic

  olympic-notification:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: olympic-notification
    ports:
      - "8084:8084"
    command: >
      sh -c "
        cd /var/www/olymp-notification &&
        composer install --no-interaction --optimize-autoloader &&
        while ! nc -z olymp-notification-db 3306; do sleep 1; done &&
        php yii migrate --interactive=0 &&
        until nc -z rabbitmq 5672; do echo 'Жду RabbitMQ...'; sleep 2; done
        sleep 5 &&
        php -S 0.0.0.0:8084 -t web > /dev/stdout 2>&1 &
        php /var/www/olymp-notification/yii queue/listen > /dev/stdout 2>&1 &
        php /var/www/olymp-notification/yii rabbitmq/listen > /dev/stdout 2>&1 &
        wait
      "
    volumes:
      - ./olymp-notification:/var/www/olymp-notification
    environment:
      - DB_HOST=olymp-notification-db
    depends_on:
      - olymp-notification-db
      - rabbitmq
    networks:
      - olympic
  websocket-server:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: olymp_websocket
    command: php /var/www/olymp-notification/websocket-server.php
    volumes:
      - ./olymp-notification:/var/www/olymp-notification
    networks:
      - olympic
    ports:
      - "8095:8095"   # пробрасываем наружу
    depends_on:
      - olymp-notification-db

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/nginx.conf
      - ./olymp-admin/public:/var/www/olymp-admin/public
      - ./olymp-notification/web:/var/www/olymp-notification/web
    depends_on:
      - olymp-admin
      - olympic-notification
    networks:
      - olympic

  olymp-admin-db:
    image: mariadb:10.11
    container_name: olymp-admin-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olymp_admin
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - olymp-admin-db_data:/var/lib/mysql
    networks:
      - olympic


  olymp-notification-db:
    image: mariadb:10.11
    container_name: olymp-notification-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olymp_notification
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - olymp-notification-db_data:/var/lib/mysql
    networks:
      - olympic

  phpmyadmin-admin:
    image: phpmyadmin:latest
    container_name: olymp_admin_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: olymp-admin-db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - olymp-admin-db
    networks:
      - olympic

  phpmyadmin-notification:
    image: phpmyadmin:latest
    container_name: olymp_notification_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: olymp-notification-db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - olymp-notification-db
    networks:
      - olympic

  redis:
    image: redis:latest
    container_name: olymp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - olympic

  rabbitmq:
    image: rabbitmq:management
    container_name: olymp_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management load_definitions \"/etc/rabbitmq/definitions.json\""
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - olympic
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
