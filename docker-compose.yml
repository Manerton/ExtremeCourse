  redis:
    image: redis:latest
    container_name: olymp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - olympic

networks:
  olympic:
    driver: bridge

volumes:
  sso-db-data:
  redis_data:
