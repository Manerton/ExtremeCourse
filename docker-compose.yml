  sso-db:
    image: postgres:16-alpine
    container_name: sso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: course_pass
      POSTGRES_DB: ExtremeCourse
    ports:
      - "5444:5432"
    networks:
      - olympic
    volumes:
      - sso-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  sso-service:
    build:
      context: ./sso-service
      dockerfile: Dockerfile
    container_name: sso-service
    restart: unless-stopped
    depends_on:
      sso-db:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./sso-service/config-yaml/docker.yaml:/app/config.yaml:ro

    networks:
      - olympic
    ports:
      - "8989:8181"
  
  # nginx:
